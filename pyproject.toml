[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aktuel-brosur-scraper"
version = "0.1.0"
description = "Collects weekly supermarket brochures in Turkey and publishes them as JSON."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "selectolax>=0.3.27",
    "pymupdf>=1.25",
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["scraper*"]
exclude = ["scraper.tests*"]

[tool.pytest.ini_options]
testpaths = ["scraper/tests"]
addopts = "-ra"
