name: CI (scraper)

# Path filters only exist per workflow, so the scraper and the app have one file each.
on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "schema/**"
      - "pyproject.toml"
      - ".github/workflows/ci-scraper.yml"
  pull_request:
    paths:
      - "scraper/**"
      - "schema/**"
      - "pyproject.toml"
      - ".github/workflows/ci-scraper.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scraper with test tools
        run: python -m pip install -e ".[dev]"

      - name: Run tests (no network)
        run: python -m pytest
