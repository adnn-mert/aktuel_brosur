name: Scrape and publish

# Collects every source three times a day and publishes catalog.json, health.json,
# products/ and media/ to the `data` branch (served by GitHub Pages). The branch is
# rewritten as a single commit each time, so it never accumulates history.
on:
  schedule:
    # 06:17, 12:17 and 18:17 in Turkey (UTC+3); off the hour to avoid the top-of-hour rush.
    - cron: "17 3,9,15 * * *"
  workflow_dispatch:

# Runs queue instead of overlapping: two runs pushing the data branch would race.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Lets site operators see who is calling; derived from the repo, no personal data.
      SCRAPER_CONTACT_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scraper
        run: python -m pip install -e .

      - name: Restore previous output from the data branch
        run: python -m scraper.publish fetch-state --dir state

      - name: Scrape
        id: scrape
        # The exit code decides what happens next: 0 publish, 2 publish then fail, 1 stop.
        run: |
          set +e
          python -m scraper run --state-dir state --out out
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish to the data branch
        run: python -m scraper.publish publish --out out --exit-code "${{ steps.scrape.outputs.code }}"
