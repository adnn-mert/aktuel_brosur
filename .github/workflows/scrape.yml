name: Scrape and publish

# Collects every source three times a day and publishes catalog.json, health.json,
# products/, products_ocr/, ocr_state.json and media/ to the `data` branch (served by
# GitHub Pages). The branch is rewritten as a single commit each time, so it never
# accumulates history.
on:
  schedule:
    # 06:17, 12:17 and 18:17 in Turkey (UTC+3); off the hour to avoid the top-of-hour rush.
    - cron: "17 3,9,15 * * *"
  workflow_dispatch:

# Runs queue instead of overlapping: two runs pushing the data branch would race.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  # scraper.alerts opens and closes one "Source failing: <id>" issue per failing source.
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Scraping takes a few minutes; the OCR step may take up to 55 more (Gemini reads a page in
    # about a minute and a half).
    timeout-minutes: 90
    env:
      # Lets site operators see who is calling; derived from the repo, no personal data.
      SCRAPER_CONTACT_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install scraper
        run: python -m pip install -e .

      - name: Restore previous output from the data branch
        run: python -m scraper.publish fetch-state --dir state

      - name: Scrape
        id: scrape
        # The exit code decides what happens next: 0 publish, 2 publish and raise an issue
        # (a source failed 3+ runs in a row; the job stays green), 1 stop and fail the job.
        run: |
          set +e
          python -m scraper run --state-dir state --out out
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Reads new Şok / Hakmar brochure pages with Gemini and adds products_ocr/ files to out/
      # (each brochure once; the request budget and page fingerprints live in out/ocr_state.json).
      # Only this step gets the API key. It always exits 0, rolls back any change that fails the
      # output check, and its own timeout is longer than the code's time budget, so a slow model
      # can never keep the data from being published. Without the secret it logs "OCR disabled".
      - name: Read prices from brochure pages (OCR)
        if: ${{ steps.scrape.outputs.code == '0' || steps.scrape.outputs.code == '2' }}
        continue-on-error: true
        timeout-minutes: 55
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scraper ocr --state-dir state --out out

      - name: Publish to the data branch
        id: publish
        run: python -m scraper.publish publish --out out --exit-code "${{ steps.scrape.outputs.code }}"

      # Opens one "Source failing: <id>" issue (label source-failing) per source whose
      # consecutive_failures in health.json reached 3, comments only when its error changes and
      # closes it when the source recovers. Never fails the job; API errors are warnings.
      - name: Open or close source-failing issues
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scraper.alerts --health out/health.json

      # Compares the just-published catalog with the previous one (restored into state/) and
      # sends one FCM message per chain with new brochures to topic chain-<id>. Runs whenever
      # the data went out. Without the secret it logs "notifications disabled"; it never fails
      # the job.
      - name: Send new-brochure notifications
        if: ${{ !cancelled() && steps.publish.outputs.published == 'true' }}
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python -m scraper.notify --previous state/catalog.json --current out/catalog.json
