name: CI (app)

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
